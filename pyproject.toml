[project]
name = "MineContext"
version = "0.1.0"
description = "An open-source, proactive context-aware AI partner"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "MineContext Team" }
]
keywords = ["AI", "context", "automation", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.14.1",
    "loguru>=0.7.3",
    "pyyaml>=6.0.3",
    "pandas>=3.0.6",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "openai>=3.29.0",
    "google-genai>=1.90.0",
    "jinja2>=3.1.6",
    "json-repair>=0.64.0",
    "pypdf>=6.20.0",
    "openpyxl>=3.1.5",
    "chromadb>=1.5.9",
    "pillow>=12.3.0",
    "imagehash>=4.3.2",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
]
dev = [
    "black>=24.8.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
    "pyinstaller>=6.16.0",
]

[project.scripts]
opencontext = "opencontext.cli:main"

[project.urls]
Homepage = "https://github.com/Kling0012/MineContext"
Repository = "https://github.com/Kling0012/MineContext"
Issues = "https://github.com/Kling0012/MineContext/issues"
Documentation = "https://github.com/Kling0012/MineContext"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencontext"]

# Black - 代码格式化工具
[tool.black]
line-length = 100
target-version = ["py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | frontend
)/
'''

# isort - import 语句排序工具
[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["opencontext"]
extend_skip_glob = ["frontend/*", "node_modules/*"]
