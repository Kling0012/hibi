<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hibi Blog">
  <title data-i18n="blog.title">Hibi の備忘録</title>
  <script>if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed", "light");</script>
  <link rel="stylesheet" href="../ui/app.css">
  <link rel="stylesheet" href="blog.css">
</head>
<body class="blog">
  <header class="topbar">
    <a class="brand" href="#/" data-i18n="blog.title">Hibi の備忘録</a>
    <a class="toplink" href="../ui/" data-i18n="blog.toApp">管理画面</a>
    <select id="lang-select" aria-label="表示言語" data-i18n-aria-label="status.language" style="background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:3px 6px;font-size:13px"></select>
  </header>

  <main class="blog-main">
    <!-- 一覧 -->
    <section id="list-view">
      <form class="blog-search" id="search-form" autocomplete="off">
        <input id="q" type="search" placeholder="記事を検索" data-i18n-placeholder="blog.searchPh">
      </form>
      <div class="filters" id="type-filter">
        <button class="chip on" data-type="" data-i18n="filter.all">すべて</button>
        <button class="chip" data-type="summary" data-i18n="blog.kind.summary">1日のまとめ</button>
        <button class="chip" data-type="learning" data-i18n="blog.kind.learning">技術的な学び</button>
      </div>
      <div class="active-tag" id="active-tag" hidden></div>
      <ol class="posts" id="posts"></ol>
      <p class="empty" id="posts-empty" data-i18n="blog.empty" hidden>記事はまだありません。毎日、日報の後に自動で書かれます。</p>
      <div class="more"><button class="btn" id="more" data-i18n="blog.more" hidden>もっと見る</button></div>
      <section class="tagcloud-wrap">
        <h2 data-i18n="blog.tags">タグ</h2>
        <div class="tagcloud" id="tags"></div>
      </section>
    </section>

    <!-- 記事 -->
    <article id="post-view" hidden>
      <a class="back" href="#/" data-i18n="blog.back">‹ 記事一覧</a>
      <header class="post-head">
        <div class="post-meta" id="post-meta"></div>
        <h1 id="post-title"></h1>
        <div class="post-tags" id="post-tags"></div>
      </header>
      <div class="md post-body" id="post-body"></div>
      <footer class="post-foot" id="post-foot"></footer>
      <nav class="prevnext" id="prevnext"></nav>
    </article>
  </main>

  <script src="blog.js" type="module"></script>
</body>
</html>
