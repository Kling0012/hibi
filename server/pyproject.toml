[project]
name = "hibi-server"
version = "0.1.0"
description = "Hibi work-record sync server (multi-device, RAG search)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pgvector>=0.3,<1",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
