name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  # push:
  #   tags:
  #     - v*.*.*

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
      fail-fast: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm 10.34.6
        run: corepack prepare pnpm@10.34.6 --activate

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Sync Python dependencies
        shell: bash
        run: |
          uv venv
          uv pip install --upgrade pip setuptools wheel build
          uv sync

      - name: Get release tag
        id: get-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set package.json version
        working-directory: frontend
        shell: bash
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Get pnpm store directory
      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT
        shell: bash

      # Cache pnpm dependencies
      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Note: when CSC_LINK / CSC_KEY_PASSWORD / APPLE_* secrets are not set,
      # the build falls back to an unsigned (/ad-hoc) build and still succeeds.
      - name: Build Mac Backend
        if: matrix.os == 'macos-latest'
        run: |
          source .venv/bin/activate
          chmod +x ./build.sh
          ./build.sh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build Windows Backend
        if: matrix.os == 'windows-latest'
        run: |
          .venv\Scripts\activate
          ./build.bat

      - name: Build Linux Backend
        if: matrix.os == 'ubuntu-latest'
        run: |
          source .venv/bin/activate
          chmod +x ./build.sh
          ./build.sh

      - name: Cleanup keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            echo "🧹 Deleting temporary keychain: $KEYCHAIN_PATH"
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        working-directory: frontend
        shell: bash
        run: |
          # electron-builder 26 treats an empty-string CSC_LINK as a relative
          # certificate path (resolves to the project dir and fails with
          # "not a file"). Unset empty signing envs so the build falls back
          # to an unsigned / ad-hoc build when the secrets are absent.
          [ -n "$CSC_LINK" ] || unset CSC_LINK
          [ -n "$CSC_KEY_PASSWORD" ] || unset CSC_KEY_PASSWORD
          [ -n "$APPLE_ID" ] || unset APPLE_ID
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || unset APPLE_APP_SPECIFIC_PASSWORD
          [ -n "$APPLE_TEAM_ID" ] || unset APPLE_TEAM_ID
          pnpm run build:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        working-directory: frontend
        run: |
          pnpm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        working-directory: frontend
        run: |
          pnpm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192

      # Release stays as a draft; review and publish it manually.
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          makeLatest: false
          tag: ${{ steps.get-tag.outputs.tag }}
          artifacts: 'frontend/dist/*.exe,frontend/dist/*.zip,frontend/dist/*.dmg,frontend/dist/*.AppImage,frontend/dist/*.snap,frontend/dist/*.deb,frontend/dist/*.rpm,frontend/dist/*.tar.gz,frontend/dist/latest*.yml,frontend/dist/rc*.yml,frontend/dist/beta*.yml,frontend/dist/*.blockmap'
          token: ${{ secrets.GITHUB_TOKEN }}
