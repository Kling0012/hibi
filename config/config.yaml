# OpenContext Configuration File

# General switch
enabled: true

# Logging configuration
logging:
  level: DEBUG # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_path: "${CONTEXT_PATH:.}/logs/opencontext.log" # Log file path

user_setting_path: "${CONTEXT_PATH:.}/config/user_setting.yaml"

# AI providers and priority routes (P1).
# providers: id is referenced from routes. kind is openai_compat or gemini_live.
#   Keys: api_key (inline value) or api_key_file (path, ~ expanded). Never put
#   real key values in this file.
# routes: ordered provider ids per usage. On failure (429/quota/5xx/timeout/
#   connection loss/invalid model) the next provider is tried; failed
#   providers cool down (Retry-After if present, else 60s doubling to 15min).
#   vision: image understanding. Gemini Live first (free tier), then GLM.
#   structured: outputs that must be JSON (openai_compat only; Gemini Live
#     answers via audio transcription, so it is not used for JSON).
#   chat: free-text chat / agent flows.
#   embedding: providers for vectorization. Leave empty to disable only the
#     embedding-dependent features (context storage/search); the rest works.
#   exact: verbatim on-screen text capture (single-shot GLM; P1-B screen
#     recording). Keep this route openai_compat only.
# Legacy vlm_model / embedding_model sections are still honored when this
# section has no providers (backward compatibility).
ai:
  output_language: ja
  providers:
    - id: gemini_live_38
      kind: gemini_live
      model: gemini-3.8-live
      api_key_file: "${GEMINI_KEY_FILE:~/.config/minecontext/gemini-key}"
      options:
        max_image_size: 1920
    - id: glm_flash
      kind: openai_compat
      model: glm-5.3-flash
      base_url: https://open.bigmodel.cn/api/coding/paas/v4
      api_key_file: "${ZHIPU_KEY_FILE:~/.config/minecontext/zhipu-key}"
      options:
        max_tokens: 8192
    - id: glm_53
      kind: openai_compat
      model: glm-5.3
      base_url: https://open.bigmodel.cn/api/coding/paas/v4
      api_key_file: "${ZHIPU_KEY_FILE:~/.config/minecontext/zhipu-key}"
      options:
        max_tokens: 8192
  routes:
    vision: [gemini_live_38, glm_flash]
    chat: [glm_flash, glm_53]
    structured: [glm_flash]
    # Embeddings are handled by the sync server now; the local embedding
    # route stays empty (fail-soft: no embedding-dependent features run).
    embedding: []
    exact: [glm_flash]

vlm_model:
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
  model: "${LLM_MODEL}"
  provider: ""

embedding_model:
  base_url: "${EMBEDDING_BASE_URL}"
  api_key: "${EMBEDDING_API_KEY}"
  model: "${EMBEDDING_MODEL}"
  provider: ""
  output_dim: 1024

# Context capture module
# Screen capture is driven by the Electron frontend: screenshots are uploaded
# via /api/add_screenshot(s). The backend no longer runs built-in capture
# components (screenshot/folder/file/vault-document monitors, web link capture).
capture:
  enabled: true
  # P1-B live screen recording (frames streamed to /api/live/frame by the
  # Electron frontend).
  live_fps: 1.0                # frames per second sent to the backend (0.2 - 1)
  live_summary_interval: 30    # seconds between Live activity summaries
  capture_min_interval: 20     # min seconds between 'exact' screen-text captures
  change_hash_threshold: 10    # dhash distance that counts as a big change
  exclude_apps:               # frontmost apps never recorded (password managers)
    - 1Password
    - Bitwarden
    - KeePassXC
  paused: false                # temporarily stop all live recording

# Sync server upload (P1-B). Events (activity / screen_summary / todo / report)
# are queued locally and uploaded in batches; failures retry with backoff and
# never block local recording. device_id is generated on first start and saved
# to user_setting.yaml.
sync:
  enabled: true
  server_url: "${MINECONTEXT_SYNC_URL:}"
  device_id: ""
  device_name: ""              # defaults to the hostname

# Context processing module
# The VLM screenshot/document processors, entity processor and context merger
# were removed: screen analysis runs in live_monitor (/api/live/frame) and is
# stored in SQLite + the sync server. This section is no longer read.

# Context storage module
storage:
  enabled: true
  backends:
    # SQLite only: the chromadb vector backend was removed (search moved to
    # the sync server). Existing persist/chromadb folders are left in place.
    - name: "document_store"
      storage_type: "document_db"
      backend: "sqlite"
      config:
        path: "${CONTEXT_PATH:.}/persist/sqlite/app.db"

# Context consumption module
consumption:
  enabled: true

# web server
web:
  host: "127.0.0.1"
  port: 1733

# API authentication configuration
api_auth:
  enabled: false # Enable authentication in production environment for security
  api_keys:
    - "${CONTEXT_API_KEY:test}"
  excluded_paths:
    - "/health"
    - "/api/health"
    - "/api/auth/status"

# Prompts configuration
prompts:
  language: "en"

# Content generation service configuration
# The 15-minute activity generator and the daily report generator were
# removed (activity records now come from live_monitor); only tips run locally.
# ToDos are added by the user on the sync server.
content_generation:
  # Debug configuration
  debug:
    enabled: false # Enable debug mode to save generation messages and responses
    output_path: "${CONTEXT_PATH:.}/debug/generation" # Debug output directory

  # Task configurations
  tips:
    enabled: true
    interval: 3600 # Seconds, minimum 1800 (30 minutes), recommended 3600-7200 (1-2 hours)

  todos:
    enabled: false # Automatic ToDo generation is disabled; users add ToDos on the sync server.
    interval: 1800 # Seconds, minimum 1800 (30 minutes), recommended 1800-3600 (30-60 minutes)
