# OpenContext Configuration File

# General switch
enabled: true

# Logging configuration
logging:
  level: DEBUG # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_path: "${CONTEXT_PATH:.}/logs/opencontext.log" # Log file path

user_setting_path: "${CONTEXT_PATH:.}/config/user_setting.yaml"

# 文档处理配置
document_processing:
  enabled: true
  batch_size: 3        # Number of images processed by VLM at once (recommended 2-5)
  max_image_size: 1024 # Maximum image size (pixels), larger sizes increase accuracy but also API costs
  dpi: 200             # DPI for converting PDF to images (recommended 150-300)

  # Page-by-page detection configuration (to optimize VLM usage)
  text_threshold_per_page: 50 # Scanned document threshold: pages with fewer characters than this value are considered scanned documents (requires VLM)

# AI providers and priority routes (P1).
# providers: id is referenced from routes. kind is openai_compat or gemini_live.
#   Keys: api_key (inline value) or api_key_file (path, ~ expanded). Never put
#   real key values in this file.
# routes: ordered provider ids per usage. On failure (429/quota/5xx/timeout/
#   connection loss/invalid model) the next provider is tried; failed
#   providers cool down (Retry-After if present, else 60s doubling to 15min).
#   vision: image understanding. Gemini Live first (free tier), then GLM.
#   structured: outputs that must be JSON (openai_compat only; Gemini Live
#     answers via audio transcription, so it is not used for JSON).
#   chat: free-text chat / agent flows.
#   embedding: providers for vectorization. Leave empty to disable only the
#     embedding-dependent features (context storage/search); the rest works.
#   exact: verbatim on-screen text capture (single-shot GLM; P1-B screen
#     recording). Keep this route openai_compat only.
# Legacy vlm_model / embedding_model sections are still honored when this
# section has no providers (backward compatibility).
ai:
  output_language: ja
  providers:
    - id: gemini_live_38
      kind: gemini_live
      model: gemini-3.8-live
      api_key_file: "${GEMINI_KEY_FILE:~/.config/minecontext/gemini-key}"
      options:
        max_image_size: 1920
    - id: glm_flash
      kind: openai_compat
      model: glm-5.3-flash
      base_url: https://open.bigmodel.cn/api/coding/paas/v4
      api_key_file: "${ZHIPU_KEY_FILE:~/.config/minecontext/zhipu-key}"
      options:
        max_tokens: 8192
    - id: glm_53
      kind: openai_compat
      model: glm-5.3
      base_url: https://open.bigmodel.cn/api/coding/paas/v4
      api_key_file: "${ZHIPU_KEY_FILE:~/.config/minecontext/zhipu-key}"
      options:
        max_tokens: 8192
    - id: glm_embedding
      kind: openai_compat
      model: embedding-3
      base_url: https://open.bigmodel.cn/api/coding/paas/v4
      api_key_file: "${ZHIPU_KEY_FILE:~/.config/minecontext/zhipu-key}"
      options:
        output_dim: 2048
  routes:
    vision: [gemini_live_38, glm_flash]
    chat: [glm_flash, glm_53]
    structured: [glm_flash]
    embedding: [glm_embedding]
    exact: [glm_flash]

vlm_model:
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
  model: "${LLM_MODEL}"
  provider: ""

embedding_model:
  base_url: "${EMBEDDING_BASE_URL}"
  api_key: "${EMBEDDING_API_KEY}"
  model: "${EMBEDDING_MODEL}"
  provider: ""
  output_dim: 2048

# Context capture module
# Screen capture is driven by the Electron frontend: screenshots are uploaded
# via /api/add_screenshot(s). The backend no longer runs built-in capture
# components (screenshot/folder/file/vault-document monitors, web link capture).
capture:
  enabled: true
  # P1-B live screen recording (frames streamed to /api/live/frame by the
  # Electron frontend).
  live_fps: 1.0                # frames per second sent to the backend (0.2 - 1)
  live_summary_interval: 30    # seconds between Live activity summaries
  capture_min_interval: 20     # min seconds between 'exact' screen-text captures
  change_hash_threshold: 10    # dhash distance that counts as a big change
  exclude_apps:               # frontmost apps never recorded (password managers)
    - 1Password
    - Bitwarden
    - KeePassXC
  paused: false                # temporarily stop all live recording

# Sync server upload (P1-B). Events (activity / screen_summary / todo / report)
# are queued locally and uploaded in batches; failures retry with backoff and
# never block local recording. device_id is generated on first start and saved
# to user_setting.yaml.
sync:
  enabled: true
  server_url: "http://<sync-server-ip>:18740"
  device_id: ""
  device_name: ""              # defaults to the hostname

# Context processing module
processing:
  enabled: true
  # Document processor configuration
  document_processor:
    enabled: true
    batch_size: 5
    batch_timeout: 30
  screenshot_processor:
    enabled: true
    dedup_cache_size: 30
    similarity_hash_threshold: 7
    batch_size: 20 # Increase batch size to improve throughput
    batch_timeout: 10 # Reduce timeout to improve response speed
    max_image_size: 1920 # Limit image size to reduce memory usage
    resize_quality: 85 # Balance quality and performance
    enabled_delete: true
    max_raw_properties: 5

  # Context merger configuration
  context_merger:
    enabled: false
    # Basic configuration
    similarity_threshold: 0.90
    associative_similarity_threshold: 0.6

    # Intelligent merging configuration
    use_intelligent_merging: true # Enable intelligent strategy merging
    enable_memory_management: true # Enable memory management
    cleanup_interval_hours: 24 # Cleanup check interval

    # Cross-type association configuration
    enable_cross_type_processing: true # Enable cross-type processing
    conversion_confidence_threshold: 0.8 # Conversion confidence threshold
    max_conversions_per_session: 10 # Maximum conversions per session

    # Type-specific configuration
    # Profile type configuration
    ENTITY_CONTEXT_similarity_threshold: 0.85
    ENTITY_CONTEXT_retention_days: 365
    ENTITY_CONTEXT_max_merge_count: 5

    # Activity type configuration
    activity_context_similarity_threshold: 0.80
    activity_context_retention_days: 90
    activity_context_max_merge_count: 3
    activity_context_time_window_hours: 24

    # Intent type configuration
    intent_context_similarity_threshold: 0.75
    intent_context_retention_days: 180
    intent_context_max_merge_count: 4

    # Semantic type configuration
    semantic_context_similarity_threshold: 0.72
    semantic_context_retention_days: 180
    semantic_context_max_merge_count: 6

    # Procedural type configuration
    procedural_context_similarity_threshold: 0.75
    procedural_context_retention_days: 120
    procedural_context_max_merge_count: 4

    # State type configuration
    state_context_similarity_threshold: 0.70
    state_context_retention_days: 7
    state_context_max_merge_count: 10
    state_context_time_window_minutes: 30

# Context storage module
storage:
  enabled: true
  backends:
    # Vector database (ChromaDB, local mode)
    - name: "default_vector"
      storage_type: "vector_db"
      backend: "chromadb"
      config:
        mode: "local" # Options: "local", "server"
        path: "${CONTEXT_PATH:.}/persist/chromadb"
        collection_prefix: "opencontext"

    - name: "document_store"
      storage_type: "document_db"
      backend: "sqlite"
      config:
        path: "${CONTEXT_PATH:.}/persist/sqlite/app.db"

# Context consumption module
consumption:
  enabled: true

# web server
web:
  host: "127.0.0.1"
  port: 1733

# API authentication configuration
api_auth:
  enabled: false # Enable authentication in production environment for security
  api_keys:
    - "${CONTEXT_API_KEY:test}"
  excluded_paths:
    - "/health"
    - "/api/health"
    - "/api/auth/status"

# Prompts configuration
prompts:
  language: "en"

# Content generation service configuration
content_generation:
  # Debug configuration
  debug:
    enabled: false # Enable debug mode to save generation messages and responses
    output_path: "${CONTEXT_PATH:.}/debug/generation" # Debug output directory

  # Task configurations
  activity:
    enabled: true
    interval: 900 # Seconds, minimum 600 (10 minutes), recommended 900-1800 (15-30 minutes)

  tips:
    enabled: true
    interval: 3600 # Seconds, minimum 1800 (30 minutes), recommended 3600-7200 (1-2 hours)

  todos:
    enabled: true
    interval: 1800 # Seconds, minimum 1800 (30 minutes), recommended 1800-3600 (30-60 minutes)

  report:
    enabled: true
    time: "08:00" # Daily report generation time (HH:MM)
