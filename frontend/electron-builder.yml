appId: com.kling0012.hibi
productName: Hibi
directories:
  output: dist
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!**/.swc/*'
  - '!src/*'
  # Python externals are dev-time build inputs; packaged apps use the copies
  # placed under resources/bin by extraResources (the venv symlinks to the
  # system Python also break electron-builder's asar packaging).
  - '!externals/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: backend/
    to: backend/
    filter:
      - '**/*'
asarUnpack:
  - resources/**
win:
  executableName: Hibi
  icon: build/icon.ico
nsis:
  artifactName: Hibi-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  differentialPackage: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
mac:
  extraResources:
    - from: externals/python/window_inspector/dist/window_inspector/window_inspector
      to: bin/window_inspector
    - from: externals/python/window_capture/dist/window_capture/window_capture
      to: bin/window_capture
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.png
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: Hibi-${version}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: Kling0012
  category: Utility
appImage:
  artifactName: Hibi-${version}.${ext}
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
afterSign: build/notarize.js
publish:
  provider: github
  owner: Kling0012
  repo: MineContext
